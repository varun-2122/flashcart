<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign In - FlashCart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap');
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "var(--color-surface)",
                        "primary": "var(--color-primary)",
                        "on-surface": "var(--color-on-surface)",
                        "background": "var(--color-background)",
                        "surface-container": "var(--color-surface-container)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                    },
                    "fontFamily": {
                        "data-mono-lg": ["Geist Mono"],
                        "data-mono-md": ["Geist Mono"],
                        "label-caps": ["Geist Mono"],
                        "body-md": ["Geist"],
                        "display-lg": ["Geist"]
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        :root {
            --color-background: #ffffff;
            --color-surface: #f8fafc;
            --color-surface-container: #f1f5f9;
            --color-on-surface: #0f172a;
            --color-on-surface-variant: #64748b;
            --color-primary: #2F6FFF;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        .dark {
            --color-background: #111415;
            --color-surface: #111415;
            --color-surface-container: #1e2021;
            --color-on-surface: #e2e2e4;
            --color-on-surface-variant: #c3c6d8;
            --color-primary: #b4c5ff;
            --glass-bg: rgba(30, 32, 33, 0.8);
            --glass-border: rgba(255, 255, 255, 0.05);
        }
        @layer utilities {
            .glass-panel {
                background: var(--glass-bg);
                backdrop-filter: blur(20px);
                border: 1px solid var(--glass-border);
            }
            .volt-gradient {
                background: linear-gradient(90deg, #2F6FFF 0%, #A63CFF 100%);
            }
            .input-minimal {
                @apply bg-transparent border-0 border-b border-outline/30 text-on-surface font-body-md focus:ring-0 focus:border-primary px-0 py-2 transition-colors outline-none;
            }
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased">
    <main class="flex-grow flex items-center justify-center p-4 relative z-10">
        <div class="absolute top-4 right-4 flex items-center gap-4">
            <button id="themeToggle" onclick="toggleTheme()" class="text-on-surface-variant hover:text-primary transition-colors duration-200 volt-glow rounded">
                <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
            </button>
            <button onclick="window.location.href='/index.html'" class="text-on-surface-variant hover:text-primary transition-colors duration-200 volt-glow rounded flex items-center gap-2">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="glass-panel w-full max-w-md rounded-xl p-10 relative z-10 overflow-hidden group">
            <div class="absolute top-0 left-0 w-full h-[2px] volt-gradient opacity-80"></div>
            <div class="mb-10 text-center">
                <h1 class="font-display-lg text-4xl tracking-tighter text-primary mb-2">FLASHCART</h1>
                <p class="font-label-caps text-xs text-on-surface-variant uppercase">Secure Authentication</p>
            </div>
            
            <div class="flex justify-center mb-6">
                <!-- Replace 'YOUR_GOOGLE_CLIENT_ID' with the actual client ID -->
                <div id="g_id_onload"
                     data-client_id="213138544307-3bgss7ang1deccl0efqn5dd1k1id03s1.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleLogin"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>

            <div class="flex items-center gap-4 mb-6">
                <div class="h-px bg-outline/30 flex-1"></div>
                <span class="text-xs text-on-surface-variant uppercase font-label-caps">OR EMAIL</span>
                <div class="h-px bg-outline/30 flex-1"></div>
            </div>

            <form class="flex flex-col gap-6" id="signinForm" onsubmit="handleLogin(event)">
                <div class="relative group/input">
                    <input class="input-minimal w-full" id="email" placeholder="Email Address" required="" type="email"/>
                </div>
                <div class="relative group/input">
                    <input class="input-minimal w-full" id="password" placeholder="Password" required="" type="password"/>
                </div>
                <button class="w-full volt-gradient text-background font-data-mono-md py-3 rounded mt-4 hover:opacity-90 transition-opacity" type="submit">
                    Authenticate
                </button>
                <div id="authError" class="text-red-400 text-sm mt-2 hidden text-center"></div>
            </form>
        </div>
    </main>
    <script src="/js/app.js?v=2"></script>
</body>
</html>
