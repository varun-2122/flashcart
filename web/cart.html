<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IGNITION - Cart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#111415",
                        "primary": "#b4c5ff",
                        "background": "#111415",
                        "surface-container": "#1e2021",
                        "surface-container-high": "#282a2c",
                        "on-surface-variant": "#c3c6d8",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-white font-body-md min-h-screen relative overflow-hidden">
    <!-- Dim Overlay -->
    <div class="fixed inset-0 bg-surface/80 backdrop-blur-md z-40"></div>
    
    <!-- Cart Drawer -->
    <aside class="fixed right-0 top-0 h-full w-full md:w-[480px] bg-[#17171B] z-[60] border-l border-white/10 flex flex-col">
        <header class="flex justify-between items-center p-6 border-b border-white/5">
            <div class="flex items-center gap-2">
                <h2 class="text-xl font-semibold">Your Cart</h2>
            </div>
            <button onclick="window.location.href='/index.html'" class="text-gray-400 hover:text-white transition-colors p-2 rounded-full hover:bg-white/5">
                <span class="material-symbols-outlined">close</span>
            </button>
        </header>

        <!-- Cart Items -->
        <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Items injected here by JS -->
        </div>

        <!-- Footer / Checkout -->
        <div class="p-6 border-t border-white/5 bg-[#17171B]">
            <div class="flex justify-between items-center mb-6">
                <span class="text-gray-400">Subtotal</span>
                <span id="cartSubtotal" class="text-2xl font-mono font-semibold text-primary">$0.00</span>
            </div>
            <button id="checkoutBtn" onclick="checkout()" class="w-full bg-blue-600 text-white py-4 rounded font-bold uppercase tracking-wider hover:bg-blue-500 transition-colors">
                Proceed to Checkout
            </button>
            <div id="checkoutMsg" class="mt-4 text-sm text-center"></div>
        </div>
    </aside>
    <script src="/js/app.js"></script>
    <script>
        // Load cart on page load
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
