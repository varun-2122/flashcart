<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FlashCart - Cart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        :root {
            --color-background: #ffffff;
            --color-surface: #f8fafc;
            --color-surface-container: #f1f5f9;
            --color-surface-container-high: #e2e8f0;
            --color-on-surface-variant: #64748b;
            --color-primary: #2F6FFF;
        }
        .dark {
            --color-background: #111415;
            --color-surface: #111415;
            --color-surface-container: #1e2021;
            --color-surface-container-high: #282a2c;
            --color-on-surface-variant: #c3c6d8;
            --color-primary: #b4c5ff;
        }
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "var(--color-surface)",
                        "primary": "var(--color-primary)",
                        "background": "var(--color-background)",
                        "surface-container": "var(--color-surface-container)",
                        "surface-container-high": "var(--color-surface-container-high)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen relative overflow-hidden">
    <!-- Dim Overlay -->
    <div class="fixed inset-0 bg-surface/80 backdrop-blur-md z-40"></div>
    
    <!-- Cart Drawer -->
    <aside class="fixed right-0 top-0 h-full w-full md:w-[480px] bg-surface z-[60] border-l border-outline/20 flex flex-col">
        <header class="flex justify-between items-center p-6 border-b border-outline/20">
            <div class="flex items-center gap-2">
                <h2 class="text-xl font-semibold">Your Cart</h2>
            </div>
            <div class="flex items-center gap-md">
                <button id="themeToggle" onclick="toggleTheme()" class="text-on-surface-variant hover:text-primary transition-colors duration-200 volt-glow rounded">
                    <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
                </button>
                <button id="authBtn" onclick="window.location.href='/auth.html'" class="text-on-surface-variant hover:text-primary transition-colors duration-200 volt-glow rounded">
                    <span class="material-symbols-outlined">account_circle</span>
                </button>
                <button id="logoutBtn" onclick="logout()" class="hidden text-on-surface-variant hover:text-red-400 transition-colors duration-200 volt-glow rounded">
                    <span class="material-symbols-outlined">logout</span>
                </button>
                <button onclick="window.location.href='/index.html'" class="text-gray-400 hover:text-on-surface transition-colors p-2 rounded-full hover:bg-outline/10">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
        </header>

        <!-- Cart Items -->
        <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Items injected here by JS -->
        </div>

        <!-- Footer / Checkout -->
        <div class="p-6 border-t border-outline/20 bg-surface">
            <div class="flex justify-between items-center mb-6">
                <span class="text-gray-400">Subtotal</span>
                <span id="cartSubtotal" class="text-2xl font-mono font-semibold text-primary">$0.00</span>
            </div>
            <button id="checkoutBtn" onclick="checkout()" class="w-full bg-blue-600 text-white py-4 rounded font-bold uppercase tracking-wider hover:bg-blue-500 transition-colors">
                Proceed to Checkout
            </button>
            <div id="checkoutMsg" class="mt-4 text-sm text-center"></div>
        </div>
    </aside>
    <script src="/js/app.js?v=2"></script>
    <script>
        // Load cart on page load
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
