<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cart — FlashCart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "var(--color-surface)",
                        "primary": "var(--color-primary)",
                        "on-surface": "var(--color-on-surface)",
                        "background": "var(--color-background)",
                        "surface-container": "var(--color-surface-container)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                        "outline": "var(--color-outline)",
                    },
                    fontFamily: { "mono": ["Geist Mono", "monospace"], "sans": ["Geist", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-background: #ffffff;
            --color-surface: #f8fafc;
            --color-surface-container: #f1f5f9;
            --color-on-surface: #0f172a;
            --color-on-surface-variant: #64748b;
            --color-primary: #2F6FFF;
            --color-outline: #e2e8f0;
        }
        .dark {
            --color-background: #080A0C;
            --color-surface: #0D0F12;
            --color-surface-container: #13161A;
            --color-on-surface: #E8EAED;
            --color-on-surface-variant: #9AA0B4;
            --color-primary: #4D8EFF;
            --color-outline: #2A2D35;
        }
        * { font-family: 'Geist', sans-serif; }
        .font-mono { font-family: 'Geist Mono', monospace !important; }
        body { background: var(--color-background); color: var(--color-on-surface); overflow-x: hidden; }
        .page-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .cart-drawer { background: var(--color-surface); border-left: 1px solid var(--color-outline); box-shadow: -20px 0 60px rgba(0,0,0,0.5); }
        .ignition-bar { background: linear-gradient(90deg, #4D8EFF, #C260FF); }
        .qty-btn { background: var(--color-surface-container); border: 1px solid var(--color-outline); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s; color: var(--color-on-surface); font-size: 16px; }
        .qty-btn:hover { border-color: #4D8EFF; color: #4D8EFF; }
        .fc-btn { font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 14px; border-radius: 8px; border: none; cursor: pointer; transition: all 0.15s; width: 100%; }
        .fc-btn-primary { background: linear-gradient(135deg, #4D8EFF, #7B5CFF); color: #fff; }
        .fc-btn-primary:hover { opacity: 0.9; }
        .fc-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .coupon-input { background: var(--color-surface-container); border: 1px solid var(--color-outline); border-radius: 8px; padding: 10px 14px; font-size: 13px; font-family: 'Geist Mono', monospace; color: var(--color-on-surface); outline: none; width: 100%; transition: border-color 0.15s; }
        .coupon-input:focus { border-color: #4D8EFF; }
        #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 18px; border-radius: 6px; font-size: 13px; font-family: 'Geist Mono', monospace; letter-spacing: 0.04em; transition: all 0.3s ease; max-width: 320px; }
        .product-thumb { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; background: var(--color-surface-container); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .product-thumb img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="min-h-screen relative">
    <!-- Page overlay (blurred store in background) -->
    <div class="page-overlay fixed inset-0 z-40" onclick="window.location.href='/index.html'"></div>

    <!-- Cart Drawer -->
    <aside class="cart-drawer fixed right-0 top-0 h-full w-full md:w-[480px] z-50 flex flex-col">
        <!-- Top gradient bar -->
        <div class="absolute top-0 left-0 w-full h-[2px] ignition-bar"></div>

        <!-- Header -->
        <header class="flex items-center justify-between px-6 py-5 border-b border-outline">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary" style="font-size:22px">shopping_cart</span>
                <h2 class="text-base font-semibold text-on-surface">Your Cart</h2>
                <span id="itemCount" class="font-mono text-xs bg-primary text-white px-2 py-0.5 rounded-full hidden">0</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="p-2 text-on-surface-variant hover:text-primary transition-colors rounded-lg">
                    <span class="material-symbols-outlined" id="themeIcon" style="font-size:18px">light_mode</span>
                </button>
                <a href="/profile.html" class="p-2 text-on-surface-variant hover:text-primary transition-colors rounded-lg" title="My Account">
                    <span class="material-symbols-outlined" style="font-size:18px">account_circle</span>
                </a>
                <button onclick="window.location.href='/index.html'" class="p-2 text-on-surface-variant hover:text-on-surface transition-colors rounded-lg">
                    <span class="material-symbols-outlined" style="font-size:20px">close</span>
                </button>
            </div>
        </header>

        <!-- Cart Items -->
        <div id="cartItemsContainer" class="flex-1 overflow-y-auto px-6 py-4 space-y-3">
            <div class="flex items-center justify-center h-48 text-on-surface-variant">
                <div class="animate-spin rounded-full w-8 h-8 border-2 border-outline border-t-primary"></div>
            </div>
        </div>

        <!-- Bottom panel -->
        <div class="border-t border-outline px-6 py-5 space-y-4" id="cartFooter">
            <!-- Coupon -->
            <div id="couponSection">
                <div class="flex gap-2">
                    <input type="text" id="couponCode" placeholder="COUPON CODE" class="coupon-input uppercase" maxlength="30"/>
                    <button onclick="applyCoupon()" class="px-4 py-2 border border-primary text-primary font-mono text-xs rounded-lg hover:bg-primary hover:text-white transition-all uppercase tracking-wider whitespace-nowrap">
                        Apply
                    </button>
                </div>
                <div id="couponMsg" class="hidden mt-2 text-xs font-mono"></div>
            </div>

            <!-- Summary -->
            <div class="space-y-2 text-sm">
                <div class="flex justify-between text-on-surface-variant">
                    <span>Subtotal</span>
                    <span id="cartSubtotal" class="font-mono">$0.00</span>
                </div>
                <div id="discountRow" class="hidden flex justify-between text-green-400">
                    <span>Discount (<span id="discountPct">0</span>%)</span>
                    <span id="discountAmt" class="font-mono">-$0.00</span>
                </div>
                <div class="flex justify-between font-bold text-on-surface text-base pt-2 border-t border-outline">
                    <span>Total</span>
                    <span id="cartTotal" class="font-mono text-primary">$0.00</span>
                </div>
            </div>

            <button id="checkoutBtn" onclick="checkout()" class="fc-btn fc-btn-primary">
                Proceed to Checkout
            </button>
            <div id="checkoutMsg" class="text-xs font-mono text-center hidden"></div>

            <a href="/index.html" class="block text-center text-xs font-mono text-on-surface-variant hover:text-primary transition-colors uppercase tracking-wider">
                ← Continue Shopping
            </a>
        </div>
    </aside>

    <div id="toastContainer"></div>

    <script src="/js/app.js?v=3"></script>
    <script>
    // Image map
    const PRODUCT_IMAGES = {
        'TACT-APEX-01':  '/images/product_daypack.png',
        'TACT-CHRON-02': '/images/product_watch.png',
        'TACT-GHOST-03': '/images/product_jacket.png',
        'TACT-LUMEN-04': '/images/product_torch.png',
    };

    let appliedCoupon = null; // { code, discount_percent }
    let cartItems = [];

    async function loadCart() {
        const container = document.getElementById('cartItemsContainer');
        const token = getToken();
        let items = JSON.parse(localStorage.getItem('fc_cart') || '[]');

        if (token) {
            try {
                const data = await authFetch('/api/v1/cart');
                if (data?.items && Array.isArray(data.items)) {
                    items = data.items;
                    localStorage.setItem('fc_cart', JSON.stringify(items));
                }
            } catch (e) { console.warn('Server cart fetch failed:', e); }
        }

        cartItems = items || [];
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItemsContainer');
        const countEl = document.getElementById('itemCount');

        if (!cartItems.length) {
            countEl?.classList.add('hidden');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full gap-4 text-on-surface-variant py-16">
                    <span class="material-symbols-outlined text-6xl opacity-20">shopping_cart</span>
                    <p class="font-mono text-sm uppercase tracking-widest opacity-40">Your cart is empty</p>
                    <a href="/index.html" class="mt-2 px-6 py-2.5 bg-primary text-white font-mono text-xs rounded-lg uppercase tracking-wider hover:opacity-90 transition-opacity">
                        Browse Products
                    </a>
                </div>`;
            updateTotals();
            return;
        }

        const total = cartItems.reduce((s, i) => s + (i.quantity || 1), 0);
        countEl.textContent = total;
        countEl.classList.remove('hidden');

        container.innerHTML = cartItems.map((item, idx) => {
            const imgSrc = PRODUCT_IMAGES[item.sku] || null;
            const imgHtml = imgSrc
                ? `<img src="${imgSrc}" alt="${escHtml(item.name || '')}" class="w-full h-full object-cover"/>`
                : `<span class="material-symbols-outlined text-outline-variant" style="font-size:24px">inventory_2</span>`;
            const lineTotal = (item.unit_price || 0) * (item.quantity || 1);
            return `
            <div class="flex items-center gap-4 p-3 bg-surface-container rounded-xl border border-outline group">
                <div class="product-thumb">${imgHtml}</div>
                <div class="flex-1 min-w-0">
                    <p class="text-on-surface text-sm font-semibold truncate">${escHtml(item.name || 'Product')}</p>
                    <p class="text-on-surface-variant text-xs font-mono mt-0.5">${formatPrice(item.unit_price || 0)} each</p>
                    <div class="flex items-center gap-2 mt-2">
                        <button class="qty-btn" onclick="adjustQty(${idx}, -1)">−</button>
                        <span class="font-mono text-sm text-on-surface w-6 text-center">${item.quantity || 1}</span>
                        <button class="qty-btn" onclick="adjustQty(${idx}, 1)">+</button>
                    </div>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <span class="font-mono text-sm font-bold text-primary">${formatPrice(lineTotal)}</span>
                    <button onclick="removeItem(${idx})" class="text-outline-variant hover:text-red-400 transition-colors p-1 rounded">
                        <span class="material-symbols-outlined" style="font-size:16px">delete</span>
                    </button>
                </div>
            </div>`;
        }).join('');

        updateTotals();
    }

    function updateTotals() {
        const subtotal = cartItems.reduce((s, i) => s + (i.unit_price || 0) * (i.quantity || 1), 0);
        document.getElementById('cartSubtotal').textContent = formatPrice(subtotal);

        if (appliedCoupon) {
            const discount = subtotal * (appliedCoupon.discount_percent / 100);
            const total = subtotal - discount;
            document.getElementById('discountPct').textContent = appliedCoupon.discount_percent;
            document.getElementById('discountAmt').textContent = `-${formatPrice(discount)}`;
            document.getElementById('cartTotal').textContent = formatPrice(total);
            document.getElementById('discountRow').classList.remove('hidden');
        } else {
            document.getElementById('cartTotal').textContent = formatPrice(subtotal);
            document.getElementById('discountRow').classList.add('hidden');
        }
    }

    function adjustQty(idx, delta) {
        cartItems[idx].quantity = Math.max(1, (cartItems[idx].quantity || 1) + delta);
        localStorage.setItem('fc_cart', JSON.stringify(cartItems));
        renderCart();
    }

    async function removeItem(idx) {
        const item = cartItems[idx];
        const token = getToken();
        if (token && item.product_id) {
            try { await authFetch(`/api/v1/cart/items/${item.product_id}`, { method: 'DELETE' }); } catch (_) {}
        }
        cartItems.splice(idx, 1);
        localStorage.setItem('fc_cart', JSON.stringify(cartItems));
        renderCart();
    }

    async function applyCoupon() {
        const code = document.getElementById('couponCode').value.trim().toUpperCase();
        const msg  = document.getElementById('couponMsg');
        if (!code) return;
        if (!getToken()) { showToast('Sign in to use coupons', 'info'); return; }
        try {
            const data = await authFetch('/api/v1/coupons/validate', { method: 'POST', body: JSON.stringify({ code }) });
            msg.classList.remove('hidden');
            if (data.valid) {
                appliedCoupon = { code: data.code, discount_percent: data.discount_percent };
                msg.className = 'mt-2 text-xs font-mono text-green-400';
                msg.textContent = `✓ ${data.message}`;
                updateTotals();
            } else {
                appliedCoupon = null;
                msg.className = 'mt-2 text-xs font-mono text-red-400';
                msg.textContent = `✗ ${data.message}`;
                updateTotals();
            }
        } catch (err) {
            msg.classList.remove('hidden');
            msg.className = 'mt-2 text-xs font-mono text-red-400';
            msg.textContent = `Error: ${err.message}`;
        }
    }

    async function checkout() {
        const btn   = document.getElementById('checkoutBtn');
        const msgEl = document.getElementById('checkoutMsg');

        if (!getToken()) { window.location.href = '/auth.html'; return; }
        if (!cartItems.length) { showToast('Your cart is empty', 'error'); return; }

        btn.disabled    = true;
        btn.textContent = 'Processing...';
        msgEl.classList.add('hidden');

        try {
            const body = {};
            if (appliedCoupon) {
                body.coupon_code = appliedCoupon.code;
                body.coupon_discount = appliedCoupon.discount_percent;
            }
            const order = await authFetch('/api/v1/orders', { method: 'POST', body: JSON.stringify(body) });
            msgEl.className   = 'text-xs font-mono text-center text-green-400 mt-1';
            msgEl.textContent = `✓ Order placed! #${(order?.id || '').substring(0,8).toUpperCase()}`;
            msgEl.classList.remove('hidden');
            cartItems = [];
            localStorage.setItem('fc_cart', JSON.stringify([]));
            renderCart();
            setTimeout(() => window.location.href = '/profile.html#orders', 2500);
        } catch (err) {
            msgEl.className   = 'text-xs font-mono text-center text-red-400 mt-1';
            msgEl.textContent = err.message;
            msgEl.classList.remove('hidden');
            btn.disabled    = false;
            btn.textContent = 'Proceed to Checkout';
        }
    }

    document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
