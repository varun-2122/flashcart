<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FlashCart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "var(--color-surface)",
                        "on-primary": "var(--color-on-primary)",
                        "outline": "var(--color-outline)",
                        "secondary": "var(--color-secondary)",
                        "primary": "var(--color-primary)",
                        "on-surface": "var(--color-on-surface)",
                        "background": "var(--color-background)",
                        "outline-variant": "var(--color-outline-variant)",
                        "surface-container": "var(--color-surface-container)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                        "surface-container-lowest": "var(--color-surface-container-lowest)"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.25rem",
                        "xl": "0.25rem",
                        "full": "0.25rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "xs": "8px",
                        "lg": "40px",
                        "gutter": "20px",
                        "sm": "16px",
                        "md": "24px",
                        "margin-desktop": "48px",
                        "base": "4px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "data-mono-lg": ["Geist Mono", "monospace"],
                        "data-mono-md": ["Geist Mono", "monospace"],
                        "label-caps": ["Geist Mono", "monospace"],
                        "body-lg": ["Geist", "sans-serif"],
                        "display-lg": ["Geist", "sans-serif"],
                        "body-md": ["Geist", "sans-serif"],
                        "headline-md": ["Geist", "sans-serif"],
                        "headline-sm": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-background: #ffffff;
            --color-surface: #f8fafc;
            --color-surface-container: #f1f5f9;
            --color-surface-container-lowest: #ffffff;
            --color-on-surface: #0f172a;
            --color-on-surface-variant: #64748b;
            --color-primary: #2F6FFF;
            --color-on-primary: #ffffff;
            --color-secondary: #A63CFF;
            --color-outline: #cbd5e1;
            --color-outline-variant: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        .dark {
            --color-background: #0A0A0A;
            --color-surface: #0A0A0A;
            --color-surface-container: #17171B;
            --color-surface-container-lowest: #0c0e10;
            --color-on-surface: #e2e2e4;
            --color-on-surface-variant: #c3c6d8;
            --color-primary: #2F6FFF;
            --color-on-primary: #0A0A0A;
            --color-secondary: #A63CFF;
            --color-outline: #8d90a1;
            --color-outline-variant: #424655;
            --glass-bg: rgba(23, 23, 27, 0.8);
            --glass-border: rgba(255, 255, 255, 0.05);
        }
        .volt-glow:hover { box-shadow: 0 0 15px rgba(47, 111, 255, 0.15); }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); }
        .countdown-figures { font-variant-numeric: tabular-nums; }
        .ignition-strip { background: linear-gradient(to right, #2F6FFF, #A63CFF); }
        .group:hover .reveal-btn { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col antialiased">
    <!-- TopNavBar -->
    <header class="bg-surface/80 backdrop-blur-xl border-b border-outline/20 shadow-sm fixed top-0 w-full z-50">
        <div class="flex justify-between items-center px-margin-desktop py-4 max-w-[1440px] mx-auto w-full">
            <div class="font-display-lg text-display-lg font-bold tracking-tighter text-primary">
                FLASHCART
            </div>
            <div class="flex-1 max-w-md mx-8 hidden md:block">
                <div class="relative flex items-center w-full border-b border-outline-variant focus-within:border-primary transition-colors pb-1">
                    <span class="material-symbols-outlined text-on-surface-variant absolute left-0 text-[20px] ml-xs">search</span>
                    <input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md pl-lg pr-xs py-base placeholder:text-outline-variant outline-none" placeholder="Search commands..." type="text"/>
                    <div class="absolute right-xs font-data-mono-md text-data-mono-md text-outline-variant text-xs">⌘K</div>
                    <div class="absolute left-0 bottom-[-1px] w-[2px] h-[6px] bg-primary opacity-0 focus-within:opacity-100 transition-opacity"></div>
                </div>
            </div>
            <div class="flex items-center gap-md">
                <button onclick="window.location.href='/cart.html'" class="text-on-surface-variant hover:text-primary transition-colors duration-200 relative volt-glow rounded">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span id="cartBadge" class="absolute -top-1 -right-1 flex h-3 w-3 hidden">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-primary"></span>
                    </span>
                </button>
                <button id="themeToggle" onclick="toggleTheme()" class="text-on-surface-variant hover:text-primary transition-colors duration-200 volt-glow rounded">
                    <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
                </button>
                <button id="authBtn" onclick="window.location.href='/auth.html'" class="text-on-surface-variant hover:text-primary transition-colors duration-200 volt-glow rounded">
                    <span class="material-symbols-outlined">account_circle</span>
                </button>
                <button id="logoutBtn" onclick="logout()" class="hidden text-on-surface-variant hover:text-red-400 transition-colors duration-200 volt-glow rounded">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </div>
    </header>
    
    <main class="flex-1 mt-[80px] max-w-[1440px] mx-auto w-full px-gutter md:px-margin-desktop py-xl">
        <!-- Hero Section -->
        <section class="grid grid-cols-1 md:grid-cols-12 gap-gutter mb-xl relative">
            <div class="md:col-span-7 flex flex-col justify-center">
                <div class="font-label-caps text-label-caps text-primary tracking-widest uppercase mb-sm flex items-center gap-xs">
                    <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                    LIVE FLASH SALE
                </div>
                <h1 class="font-display-lg text-display-lg mb-md leading-tight text-on-surface">
                    Precision Gear.<br/>Zero Hesitation.
                </h1>
                <p class="font-body-lg text-body-lg text-on-surface-variant mb-lg max-w-lg">
                    Access elite tactical equipment before the window closes. Limited stock, absolute performance.
                </p>
                <div>
                    <button onclick="document.getElementById('products').scrollIntoView({behavior: 'smooth'})" class="bg-primary text-on-primary font-label-caps text-label-caps px-lg py-sm rounded volt-glow transition-all uppercase tracking-wider">
                        Explore Collection
                    </button>
                </div>
            </div>
            <div class="md:col-span-5 flex items-center justify-end">
                <div class="glass-panel p-md w-full max-w-sm rounded relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-[2px] ignition-strip animate-[shrink_24h_linear_forwards]" style="transform-origin: left; width: 65%;"></div>
                    <div class="font-label-caps text-label-caps text-on-surface-variant mb-md uppercase">Time Remaining</div>
                    <div class="flex justify-between items-end gap-sm countdown-figures">
                        <div class="flex flex-col">
                            <span class="font-data-mono-lg text-data-mono-lg text-on-surface">02</span>
                            <span class="font-label-caps text-label-caps text-outline-variant mt-base">DD</span>
                        </div>
                        <span class="font-data-mono-lg text-data-mono-lg text-outline-variant pb-[14px]">:</span>
                        <div class="flex flex-col">
                            <span class="font-data-mono-lg text-data-mono-lg text-on-surface">14</span>
                            <span class="font-label-caps text-label-caps text-outline-variant mt-base">HH</span>
                        </div>
                        <span class="font-data-mono-lg text-data-mono-lg text-outline-variant pb-[14px]">:</span>
                        <div class="flex flex-col">
                            <span class="font-data-mono-lg text-data-mono-lg text-on-surface">37</span>
                            <span class="font-label-caps text-label-caps text-outline-variant mt-base">MM</span>
                        </div>
                        <span class="font-data-mono-lg text-data-mono-lg text-outline-variant pb-[14px]">:</span>
                        <div class="flex flex-col">
                            <span class="font-data-mono-lg text-data-mono-lg text-primary">59</span>
                            <span class="font-label-caps text-label-caps text-outline-variant mt-base">SS</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Product Grid -->
        <section id="products" class="scroll-mt-24">
            <div class="flex flex-wrap items-center justify-between gap-md mb-lg border-b border-outline/20 pb-md">
                <div class="flex gap-xs">
                    <button class="font-label-caps text-label-caps px-sm py-xs border border-primary text-primary rounded bg-primary/10">ALL</button>
                </div>
            </div>
            
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter">
                <!-- Products will be dynamically injected here by JS -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-surface-container-lowest border-t border-outline/20 w-full relative">
        <div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop py-xl max-w-[1440px] mx-auto w-full gap-lg">
            <div class="font-headline-sm text-headline-sm text-on-surface font-bold tracking-tighter">
                FLASHCART
            </div>
            <div class="font-label-caps text-label-caps text-on-surface-variant">
                © 2026 FLASHCART TECHNOLOGIES.
            </div>
        </div>
    </footer>
    <script src="/js/app.js?v=2"></script>
</body>
</html>
