services:
  - type: web
    name: flashcart-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json

      # ── Neon PostgreSQL ────────────────────────────────────────────────────
      # Set DATABASE_URL in the Render dashboard to your Neon connection string.
      # Format: postgres://user:password@ep-xxx.region.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ── Security ──────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ── Redis (Render managed) ─────────────────────────────────────────────
      - key: REDIS_HOST
        fromService:
          type: redis
          name: flashcart-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: flashcart-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: flashcart-redis
          property: password

  - type: redis
    name: flashcart-redis
    plan: free
    region: singapore
    ipAllowList: []
