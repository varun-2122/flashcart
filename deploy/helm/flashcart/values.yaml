# Default values for flashcart.

replicaCount: 2

image:
  repository: flashcart
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flashcart.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

postgres:
  image: postgres:16-alpine
  user: postgres
  password: postgres
  db: flashcart_db
  port: 5432

redis:
  image: redis:7-alpine
  port: 6379

app:
  env: production
  logLevel: info
