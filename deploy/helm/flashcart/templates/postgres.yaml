apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flashcart.fullname" . }}-postgres
  labels:
    {{- include "flashcart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "flashcart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  serviceName: {{ include "flashcart.fullname" . }}-postgres
  template:
    metadata:
      labels:
        {{- include "flashcart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.db }}"]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flashcart.fullname" . }}-postgres
  labels:
    {{- include "flashcart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
  selector:
    {{- include "flashcart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
